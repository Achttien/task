[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gcalsheet-agent"
version = "0.1.0"
description = "Google Calendar ↔ Google Sheets weekly sync agent with Slack reminders."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "CalendarSheets Agent" }]
license = { file = "LICENSE" }
keywords = ["google calendar", "google sheets", "sync", "slack", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "google-api-python-client>=2.145.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
  "slack_sdk>=3.33.3",
  "python-dateutil>=2.9.0.post0",
  "pytz>=2024.1",
  "click>=8.1.7"
]

[project.scripts]
gcalsheet-agent = "gcalsheet_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gcalsheet_agent"]
